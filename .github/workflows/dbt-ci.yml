name: DBT CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install dbt-core dbt-snowflake

      - run: dbt deps

      - run: dbt parse

      - run: dbt compile

      - run: dbt test --target dev